<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DouDou 品牌视觉识别规范</title>
<style>
  /* 两套底色：纯白（默认，和网站一致）/ 黑。所有图形都用这些变量，切换时整套跟着反过来 */
  :root {
    --bg: #ffffff; --page: #f4f4f4; --ink: #0a0a0a; --muted: #737373; --faint: #a3a3a3; --line: #e5e5e5; --fill: #f5f5f5;
    --side: #dedbd3; --face: #ffffff; --violet: #a855f7; --focus: #0066ff; --danger: #dc2626;
    --sans: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  }
  :root.dark { --bg: #0a0a0a; --page: #050505; --ink: #fafafa; --muted: #a3a3a3; --faint: #737373; --line: #262626; --fill: #171717; --side: #2e2e2e; --face: #111111; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; transition: background .3s; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 14px 24px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--fill); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .deck { max-width: 1280px; margin: 0 auto; padding: 8px 24px 80px; display: grid; gap: 28px; }
  .slide { position: relative; aspect-ratio: 16 / 9; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4.2% 5% 3.6%; display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; transition: background .3s, border-color .3s; }
  .crumb { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .head { display: grid; grid-template-columns: 1fr 1.25fr; gap: 6%; margin-top: 2.2%; align-items: start; }
  .head h2 { margin: 0; font-size: clamp(22px, 3vw, 38px); font-weight: 700; }
  .head p { margin: .4em 0 0; font-size: clamp(11px, 1vw, 13px); line-height: 1.85; color: var(--muted); }
  .body { position: relative; min-height: 0; margin-top: 3%; }
  .foot { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); letter-spacing: .04em; }
  .cap { font-size: 12px; font-weight: 700; margin: 10px 0 4px; }
  .note, .cap + p { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.7; }
  .row { display: grid; gap: 3%; height: 100%; }
  .center { display: flex; align-items: center; justify-content: center; }
  .box { border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.6; }
  td:first-child { width: 20%; color: var(--muted); }
  .wm { font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .dim { position: absolute; font-size: 10px; color: var(--muted); }
  .tick { position: absolute; border: 0 solid var(--faint); }
  svg { display: block; overflow: visible; }
  /* 示例、图标、网页应用总是同时展示两种底色，不跟页面开关走 */
  .on-white { --bg: #ffffff; --ink: #0a0a0a; --muted: #737373; --line: #e5e5e5; --fill: #f5f5f5; --side: #dedbd3; --face: #ffffff; background: #fff; color: #0a0a0a; }
  .on-black { --bg: #0a0a0a; --ink: #fafafa; --muted: #a3a3a3; --line: #262626; --fill: #171717; --side: #2e2e2e; --face: #111111; background: #0a0a0a; color: #fafafa; }
</style>
</head>
<body>
<div class="bar"><span>DouDou · 品牌视觉识别规范 v3</span><span class="seg" role="group" aria-label="底色"><button data-t="light" class="on">纯白底</button><button data-t="dark">黑底</button></span></div>
<main class="deck" id="deck"></main>
<script>
/* ============ 品牌名（改这里就全部换） ============ */
const NAME = 'DouDou';
const CN = '豆豆';
const WHAT = '拼豆图纸';

/* ============ 标志：一颗拼豆，俯视是圆 + C，镜头压到平视是一截矮圆柱 ============
   与网站 src/ui/Logo.tsx 同一套参数：100×100 画布，半径 40，柱高 34；C 半径 20，开口朝右。
   C 跟顶面一起压扁、线宽同步变细，压到一半淡出；平视只留圆柱轮廓。 */
let fid = 0;
function bead(phiDeg, opt = {}) {
  const phi = phiDeg * Math.PI / 180, s = Math.sin(phi), c = Math.cos(phi);
  const R = 40, H = 34, ry = Math.max(R * s, .4), bh = H * c, top = 50 - bh / 2 - ry * .15 * c, bot = top + bh;
  const ink = 'var(--ink)', cColor = opt.accent || ink;
  const id = 'w' + (fid++), wob = opt.wobble ?? 1.6;
  // 笔触：同一笔再描一道细的、错开一点点 → 一边粗一边细
  const brush = (shape, w, extra = '') => shape.replace('/>', ` stroke-width="${w.toFixed(2)}" ${extra}/>`) + shape.replace(/fill="[^"]*"/, 'fill="none"').replace('/>', ` stroke-width="${(w * .5).toFixed(2)}" transform="translate(.9 .8)" ${extra}/>`);
  const body = bh > .5 ? brush(`<path d="M${50 - R} ${top} V${bot} A${R} ${ry} 0 0 0 ${50 + R} ${bot} V${top}" fill="var(--side)" stroke="${ink}" stroke-linejoin="round" stroke-linecap="round"/>`, 4.4) : '';
  const r = R * .5, cy = r * s, ca = Math.min(1, Math.max(0, (s - .3) / .4));
  const cm = ca > 0 ? brush(`<path d="M${50 + r * .72} ${top - cy * .7} A${r} ${cy} 0 1 0 ${50 + r * .72} ${top + cy * .7}" fill="none" stroke="${cColor}" stroke-linecap="round"/>`, 7.6 * (.45 + .55 * s), `stroke-opacity="${ca.toFixed(2)}"`) : '';
  const face = brush(`<ellipse cx="50" cy="${top}" rx="${R}" ry="${ry}" fill="var(--face)" stroke="${ink}"/>`, 3.6 + 1.8 * s);
  const filt = wob ? `<defs><filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="${opt.seed || 3}"/><feDisplacementMap in="SourceGraphic" scale="${wob}"/></filter></defs>` : '';
  return `${filt}<g${wob ? ` filter="url(#${id})"` : ''}>${body}${face}${cm}</g>`;
}
const BEST = 56; // 静态的最佳截面：C 完整可读，侧面也露出来
// 小于 48px 的标志不加抖动滤镜：粗细两笔的笔触已经有手绘感，省下来的滤镜让页面打开更快
const mark = (size, opt = {}) => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${bead(opt.phi ?? BEST, { wobble: size >= 48 ? 1.6 : 0, ...opt })}</svg>`;
// 会动的标志：页面加载后统一驱动（data-accent 给点缀版）
const live = (size, accent = false) => `<svg class="live" data-accent="${accent ? 1 : ''}" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"></svg>`;
const WORD = (px, cn = false) => `<span style="display:inline-flex;flex-direction:column;line-height:1"><span class="wm" style="font-size:${px}px">${NAME}</span>${cn ? `<span style="font-size:${Math.round(px * .32)}px;color:var(--muted);margin-top:${px * .16}px;letter-spacing:.2em">${CN} · ${WHAT}</span>` : ''}</span>`;
const lockup = (h, cn = false) => `<span style="display:inline-flex;align-items:center;gap:${h * .24}px">${mark(h)}${WORD(Math.round(h * .62), cn)}</span>`;

/* ============ 辅助图形：转动阵列 ============
   把标志的转动拆成一格一格：一角是俯视（圆 + C），往对角一路压到平视（圆柱）。
   一个画面里只有一颗的 C 是紫色：“你的那一颗”。 */
function turnField(cols, rows, opt = {}) {
  const cell = 100, W = cols * cell, Hh = rows * cell * .82;
  let out = '';
  const acc = opt.accent || [Math.floor(cols * .55), Math.floor(rows * .4)];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let t = (c / Math.max(1, cols - 1)) * .6 + (r / Math.max(1, rows - 1)) * .4;
    if (opt.flip) t = 1 - t;
    const phi = 90 - t * 84;
    const isAcc = opt.accent !== false && c === acc[0] && r === acc[1] && phi > 45;
    out += `<g transform="translate(${c * cell} ${r * cell * .82}) scale(.9) translate(5 5)">${bead(phi, { accent: isAcc ? 'var(--violet)' : null, wobble: 0 })}</g>`;
  }
  const id = 'tf' + (fid++);
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="100%" preserveAspectRatio="${opt.par || 'xMidYMid slice'}" aria-hidden="true"><defs><filter id="${id}" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="${opt.wobble ?? 1.4}"/></filter></defs><g filter="url(#${id})">${out}</g></svg>`;
}

/* ============ 页面 ============ */
const pages = [];
const slide = (crumb, title, desc, body, no) => `<section class="slide"><div class="crumb">${crumb}</div><div class="head"><h2>${title}</h2><p>${desc}</p></div><div class="body">${body}</div><div class="foot"><span>${NAME} · 品牌视觉识别规范</span><span>${String(no).padStart(2, '0')}</span></div></section>`;

// 00 封面
pages.push(`<section class="slide" style="grid-template-rows:1fr auto">
  <div style="position:absolute;right:-4%;top:-6%;width:52%;height:112%">${turnField(5, 6, { accent: [2, 2] })}</div>
  <div style="position:relative;display:flex;flex-direction:column;justify-content:center;gap:4%">
    <div style="display:inline-flex;align-items:center;gap:22px">${live(96)}<span class="wm" style="font-size:72px">${NAME}</span></div>
    <div style="font-size:clamp(22px,2.6vw,34px);font-weight:700">品牌视觉识别规范</div>
    <div style="font-size:14px;color:var(--muted)">${WHAT} · 一颗豆，从图纸上的一格，到豆板上的一颗。</div>
  </div>
  <div class="foot"><span>${NAME} Brand Guidelines v3.0</span><span>2026.10</span></div>
</section>`);

// 01 理念
pages.push(slide('01 理念', '一颗豆，两个视角', `标志就是一颗拼豆。平时以 56° 的最佳截面出现：C 完整可读，侧面也露出来。从上往下看，它是图纸上的一格：一个圆，中间一个 C；镜头压到平视，它变成豆板上的一颗：一截矮圆柱。${NAME} 做的事，就是把一张图从“格子”变成“豆子”。整套视觉只做减法，黑白为主，颜色留给用户自己的作品。`,
  `<div class="row" style="grid-template-columns:repeat(3,1fr)">
    ${[[90, '俯视 · 一格', '图纸上的一格，就是标志本身：圆 + C。'], [48, '转动 · 从图到豆', '镜头往下压，顶面压扁，侧面露出来。'], [6, '平视 · 一颗', '豆板上的一颗豆，一截矮圆柱。']]
      .map(([p, t, d]) => `<div class="box" style="padding:8% 8% 7%;display:flex;flex-direction:column;justify-content:space-between"><div class="center" style="flex:1">${mark(110, { phi: p })}</div><div><div class="cap">${t}</div><p>${d}</p></div></div>`).join('')}
  </div>`, 1));

// 02 品牌名
pages.push(slide('02 品牌', '品牌名', `英文名 ${NAME}，默认只用英文名。需要中文名时叫「${CN}」。名字有两层来源：标志是一颗拼豆，“豆豆”就是它；创作者家里有两只猫，tootoo 和 dundun，${NAME} 和它们的名字是一家人，所以初期的图纸库也会先做猫咪系列。`,
  `<div class="row" style="grid-template-columns:1.3fr 1fr;align-items:center">
    <div class="center" style="flex-direction:column;gap:22px">
      <span class="wm" style="font-size:clamp(56px,8vw,110px)">${NAME}</span>
      <span style="display:flex;gap:18px;font-size:13px;color:var(--muted)"><span>tootoo</span><span>·</span><span>dundun</span><span>·</span><span style="color:var(--ink);font-weight:700">doudou</span></span>
    </div>
    <table>
      <tr><td>英文名</td><td>${NAME}：两个 D 大写，连写，不加空格、不加连字符。默认只用它</td></tr>
      <tr><td>中文名</td><td>${CN}：只在需要中文的地方用，比如小红书标题、口头介绍</td></tr>
      <tr><td>说明用途</td><td>需要告诉别人“这是做什么的”时，在名字后面跟「${WHAT}」</td></tr>
      <tr><td>不这样写</td><td>Doudou、DOUDOU、Dou Dou、Dou-Dou</td></tr>
    </table>
  </div>`, 2));

// 03 标准组合
pages.push(slide('02 标志', '标准组合', `标志由标志图形和英文名 ${NAME} 组成，比例固定。以图形高度 X 为基准：图形与英文名间距 0.24X，英文名字高 0.62X。需要中文或说明用途时，在英文名下方加「${CN} · ${WHAT}」，字高为英文名的 0.32 倍。`,
  `<div style="height:100%;display:grid;grid-template-rows:1.4fr 1fr;gap:6%">
    <div class="center"><div style="position:relative;display:inline-block">${lockup(120)}
      <span class="dim" style="left:-34px;top:50%;transform:translateY(-50%)">X</span><span class="tick" style="left:-14px;top:0;height:100%;border-left-width:1px"></span>
      <span class="dim" style="left:122px;top:-22px">0.24X</span><span class="tick" style="left:120px;top:-8px;width:29px;border-top-width:1px"></span>
    </div></div>
    <div class="row" style="grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:3%">
      <div><div style="height:56px;display:flex;align-items:center">${lockup(40)}</div><div class="cap">标准组合</div><p>首选：网站顶栏、海报、封面。</p></div>
      <div><div style="height:56px;display:flex;align-items:center">${lockup(40, true)}</div><div class="cap">带中文和用途</div><p>第一次露出、需要说明用途时用。</p></div>
      <div><div style="height:56px;display:flex;align-items:center">${mark(44)}</div><div class="cap">标志图形</div><p>头像、图标、角标；已经出现过名字的版面。</p></div>
    </div>
  </div>`, 3));

// 04 构造
pages.push(slide('02 标志', '图形构造', '俯视图只有两笔：外圈一个圆，中间一个开口朝右的 C。两者同心，C 比外圈粗一点，是视觉重心。线条有轻微的手绘起伏，粗细不完全均匀。',
  `<div class="row" style="grid-template-columns:1.1fr 1fr;align-items:center">
    <div class="center"><svg viewBox="-6 -6 112 112" width="80%" style="max-width:360px">
      ${Array.from({ length: 11 }, (_, i) => `<line x1="${i * 10}" y1="0" x2="${i * 10}" y2="100" stroke="var(--line)" stroke-width=".4"/><line x1="0" y1="${i * 10}" x2="100" y2="${i * 10}" stroke="var(--line)" stroke-width=".4"/>`).join('')}
      ${bead(90, { wobble: 1 })}
      <circle cx="50" cy="50" r="40" fill="none" stroke="var(--violet)" stroke-width=".4" stroke-dasharray="1.5 1"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="var(--violet)" stroke-width=".4" stroke-dasharray="1.5 1"/>
      <circle cx="50" cy="50" r="1" fill="var(--violet)"/>
    </svg></div>
    <table>
      <tr><td>外圈</td><td>半径 4 格，线宽 0.54 格</td></tr>
      <tr><td>C</td><td>同心，半径 2 格，线宽 0.76 格，开口朝右，两端圆头</td></tr>
      <tr><td>手绘感</td><td>底线：静态也要有。线条粗细不一（每一笔叠一道错开的细笔）、侧面填浅暖灰、线条轻微不规则；动起来时线条每 0.1 秒轻轻抖一下</td></tr>
      <tr><td>点缀版</td><td>只把 C 换成紫色 #A855F7</td></tr>
      <tr><td>不允许</td><td>旋转或镜像 C、把外圈填实、改线宽比例、加阴影或渐变</td></tr>
    </table>
  </div>`, 4));

// 05 图标：静态 / 动态 × 白色系列 / 黑色系列
const iconCell = (cls, kind, label, accent = false) => `<div class="${cls}" style="border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:6% 4%">
  <div style="display:flex;align-items:flex-end;gap:16px">${kind === 'live' ? live(72, accent) : mark(72, { accent: accent ? 'var(--violet)' : null })}${kind === 'live' ? live(32, accent) : mark(32, { accent: accent ? 'var(--violet)' : null })}${kind === 'live' ? '' : mark(16, { wobble: .8 })}</div>
  <span style="font-size:11px;color:var(--muted)">${label}</span></div>`;
pages.push(slide('02 标志', '图标：静态与动态', '图标分白色系列（白底黑标）和黑色系列（黑底白标），每个系列都有静态和动态两版。静态统一用 56° 的最佳截面，保留手绘笔触；动态是额外的，鼠标移到图标上才转一次（把鼠标放到「动态」那一列的图标上试试）。点缀版只把 C 换成紫色。',
  `<div style="height:100%;display:grid;grid-template-columns:auto 1fr 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:12px;align-items:stretch">
    <span></span><span class="note" style="text-align:center">静态</span><span class="note" style="text-align:center">动态</span><span class="note" style="text-align:center">点缀版（动态）</span>
    <span class="note" style="writing-mode:vertical-rl;align-self:center">白色系列</span>
    ${iconCell('on-white', 'static', '白底黑标 · 72 / 32 / 16 px')}${iconCell('on-white', 'live', '悬停：俯视 → 平视 → 回到 56°')}${iconCell('on-white', 'live', '紫色 C', true)}
    <span class="note" style="writing-mode:vertical-rl;align-self:center">黑色系列</span>
    ${iconCell('on-black', 'static', '黑底白标 · 72 / 32 / 16 px')}${iconCell('on-black', 'live', '悬停：俯视 → 平视 → 回到 56°')}${iconCell('on-black', 'live', '紫色 C', true)}
  </div>`, 5));

// 06 动效
pages.push(slide('02 标志', '动效：镜头语言', '鼠标移到图标上时动一次，约 3 秒：从 56° 抬到俯视，再压到平视，最后回到 56°。两端只保留各自的元素：俯视只有圆和 C，平视只有圆柱轮廓；C 跟着顶面压扁、线宽同步变细，压到一半淡出。',
  `<div style="height:100%;display:grid;grid-template-rows:1fr auto;gap:4%">
    <div class="row" style="grid-template-columns:repeat(5,1fr);align-items:center">
      ${[[56, '① 静止：56°'], [90, '② 抬到俯视'], [34, '③ 往下压，C 淡出'], [6, '④ 平视 停 0.5s'], [null, '⑤ 悬停试试']]
        .map(([p, t]) => `<div class="center" style="flex-direction:column;gap:14px">${p === null ? live(96) : mark(96, { phi: p })}<p class="note">${t}</p></div>`).join('')}
    </div>
    <table>
      <tr><td>默认</td><td>所有地方静止在 56°，不循环、不常驻抖动，省资源、加载快</td></tr>
      <tr><td>悬停动一次</td><td>网站顶栏、上传卡片、封面：鼠标移到图标上才动</td></tr>
      <tr><td>只用静态</td><td>16 px 网页图标、打印品；系统开了“减少动态效果”时也只显示静态</td></tr>
    </table>
  </div>`, 6));

// 07 色彩
const chip = (bg, name, val, role, txt, pct) => `<div style="display:flex;flex-direction:column;gap:8px"><div style="flex:1;min-height:90px;border-radius:8px;background:${bg};border:1px solid var(--line);color:${txt};padding:12px;display:flex;align-items:flex-end;font-size:20px;font-weight:700">${pct}</div><div class="cap" style="margin:0">${name}</div><p>${val}<br>${role}</p></div>`;

/* ============ 会动的标志：鼠标移到图标上才动一次（俯视 → 平视 → 回到最佳截面），平时静止在 56° ============ */
(function () {
  const KEYS = [[BEST, 0], [90, 450], [90, 800], [6, 1900], [6, 2400], [BEST, 3100]], TOT = 3100;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const phiAt = ms => { for (let i = 1; i < KEYS.length; i++) { const [a0, t0] = KEYS[i - 1], [a1, t1] = KEYS[i]; if (ms <= t1) return t1 === t0 ? a1 : a0 + (a1 - a0) * ease((ms - t0) / (t1 - t0)); } return BEST; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('svg.live').forEach(svg => {
    const accent = svg.dataset.accent ? 'var(--violet)' : null;
    const draw = (p, seed) => { svg.innerHTML = bead(p, { wobble: 1.8, seed, accent }); };
    draw(BEST, 3);
    if (reduced) return;
    let running = false;
    svg.style.cursor = 'pointer';
    svg.addEventListener('mouseenter', () => {
      if (running) return;
      running = true;
      const start = performance.now(); let seed = 1, last = start;
      const tick = now => {
        const t = now - start;
        if (t >= TOT) { draw(BEST, 3); running = false; return; }
        if (now - last > 110) { seed = seed % 7 + 1; last = now; }
        draw(phiAt(t), seed);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  });
})();

  document.documentElement.classList.toggle('dark', b.dataset.t === 'dark');
  document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b));
}));
</script>
</body>
